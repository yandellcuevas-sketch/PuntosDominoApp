workflows:
  ios-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Puntos Domino"
    environment:
      node: latest
      xcode: latest
      groups:
        - appstore_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Capacitor Sync
        script: npx cap sync ios
      - name: Set build number
        script: |
          cd ios/App
          xcrun agvtool new-version -all $BUILD_NUMBER
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.yandell.dominoscore" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT" --verbose
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "/Users/builder/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # =========================================================================
  # ?? FLUJO DE TRABAJO PARA ANDROID (GOOGLE PLAY STORE)
  # =========================================================================
  android-workflow:
    name: Android Capacitor Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      java: 21
      android_signing:
        - domino
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Capacitor Sync Android
        script: npx cap sync android
      - name: Build Android App Bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
